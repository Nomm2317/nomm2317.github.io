<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact </title><link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Naomi</a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="resume.html">Resume</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main class="page-shell">
      <div class="contact-layout">
        <div>
          <h1>Let's Connect</h1>
          <p class="lede">Add your name and email and let's get in touch!</p>
        </div>
        <div class="contact-card">
          <form>
            <label for="name">Name
              <input id="name" name="name" type="text" placeholder="Your name">
            </label>
            <label for="email">Email
              <input id="email" name="email" type="email" placeholder="you@example.com">
            </label>
            <label for="message">Message
              <textarea id="message" name="message" placeholder="Tell me a little about it..."></textarea>
            </label>
            <button class="button" type="submit">Send message</button>
          </form>
        </div>
      </div>
    </main>
    <footer>© 2026 Naomi's Personal Website <span aria-hidden="true">•</span> Made with intention</footer>
  </body>
</html>
